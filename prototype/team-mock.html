<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>팀 화면 시안 · 오시에테</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/quiple/galmuri/dist/galmuri.css">
<style>
  /* 시안 전용 페이지. 본편(index.html)과 토큰을 맞춰 두고, 확정되면
     이 파일은 지우고 본편에 합칩니다. */
  :root {
    --ca: #2B5BFF; --ca-deep: #1436B8; --ca-pale: #DCE5FF;
    --cb: #FF4D9A; --cb-deep: #C71E67; --cb-pale: #FFE0EC;
    --ink: #262232; --sub: #736E85;
    --card: #FFFFFF; --edge: #E2DEEE; --edge-deep: #CBC5DC;
    --g-base: #6182F6; --g-edge: #2E4FC4; --g-light: #A9BEFF;
    --body: "Pretendard Variable", Pretendard, "Malgun Gothic", sans-serif;
    --pixel: "Galmuri11", "Malgun Gothic", sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-family: var(--body); color: var(--ink); }
  body { min-height: 100dvh; background: linear-gradient(#BDDFFF, #E4F1FF 60%, #FFEDF5); padding: 26px 14px 60px; }
  canvas, img.chr { image-rendering: pixelated; }
  button { font: inherit; cursor: pointer; }

  .note { max-width: 880px; margin: 0 auto 14px; font-family: var(--pixel); font-size: 12px; color: var(--g-edge);
    background: rgba(255,255,255,0.75); border: 2px dashed var(--g-light); border-radius: 12px; padding: 8px 13px; }

  .gwin { max-width: 880px; margin: 0 auto; background: var(--card); border: 4px solid var(--edge-deep);
    border-radius: 20px; box-shadow: 0 7px 0 var(--edge-deep); overflow: hidden; }
  .gbar { display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 13px 18px; background: var(--g-base); color: #fff; border-bottom: 4px solid var(--edge-deep); }
  .gbar .gt { font-family: var(--pixel); font-size: 15px; letter-spacing: 0.04em; }
  .gbar .gq { font-family: var(--pixel); font-size: 12px; color: rgba(255,255,255,0.78); }

  .acts { display: flex; gap: 10px; justify-content: center; padding: 4px 18px 22px; }
  .graph { margin-top: 10px; }
  .gbtn { font-family: var(--pixel); font-size: 13px; padding: 11px 20px; background: var(--card); color: var(--ink);
    border: 3px solid var(--edge-deep); border-radius: 15px; box-shadow: 0 4px 0 var(--edge-deep);
    transition: transform 0.08s, box-shadow 0.08s; }
  .gbtn:hover { transform: translateY(-2px); }
  .gbtn.blue { background: var(--ca); border-color: var(--ca-deep); box-shadow: 0 4px 0 var(--ca-deep); color: #fff; }
  .gbtn.pink { background: var(--cb); border-color: var(--cb-deep); box-shadow: 0 4px 0 var(--cb-deep); color: #fff; }

  /* ── 관계 그래프 ─────────────────────────── */
  .graph { position: relative; height: 330px; margin: 6px 14px 0; }
  /* 발판 캔버스만 늘린다. .graph canvas 로 쓰면 아이템 캔버스까지 늘어나서
     캐릭터를 덮어 버린다 — 한 번 겪었다. */
  #trail { position: absolute; inset: 0; width: 100%; height: 100%; }
  .who { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .who .pic { position: relative; background: rgba(255,255,255,0.92); border: 3px solid var(--edge-deep); border-radius: 18px; padding: 9px; line-height: 0; }
  .who .pic canvas { position: absolute; right: -9px; bottom: -7px; }
  .who b { font-family: var(--pixel); font-size: 12px; background: rgba(255,255,255,0.9); border-radius: 8px; padding: 2px 7px; }
  .who span { font-size: 11.5px; color: var(--sub); }
  .lbl { position: absolute; transform: translate(-50%, -50%); font-family: var(--pixel); font-size: 11px;
    background: var(--card); border: 2px solid var(--edge-deep); border-radius: 10px; padding: 4px 9px; cursor: pointer;
    text-align: center; transition: background-color 0.12s, color 0.12s, border-color 0.12s; }
  .lbl:hover { border-color: var(--ca); }
  .lbl.on { background: var(--ca); border-color: var(--ca-deep); color: #fff; }
  /* 강조하는 두 쌍. 등급이 아니라 표시까지만 */
  .lbl em { display: block; font-style: normal; font-size: 10px; margin-bottom: 2px; }
  .lbl.good { border-color: var(--ca); }
  .lbl.good em { color: var(--ca); }
  .lbl.warn { border-color: var(--cb); }
  .lbl.warn em { color: var(--cb); }
  .lbl.on em { color: #fff; }

  /* ── 팀 한 줄 + 팀 축 규칙 (본편) ────────── */
  .one { margin: 16px 18px 0; padding: 14px 17px; background: var(--ca-pale); border-radius: 16px; }
  .one i { display: block; font-style: normal; font-family: var(--pixel); font-size: 11px; color: var(--ca); margin-bottom: 6px; }
  .one p { font-size: 15px; line-height: 1.7; font-weight: 600; }
  .team { margin: 12px 18px 4px; }
  .team h2 { font-family: var(--pixel); font-size: 14px; color: var(--ca); margin: 2px 2px 4px; }
  .trow { padding: 12px 2px 13px; border-bottom: 2px dashed var(--edge); }
  .trow:last-child { border-bottom: none; }
  .trow .sit { font-family: var(--pixel); font-size: 12px; color: var(--g-edge); margin-bottom: 6px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .trow .sit i { font-style: normal; font-size: 11px; color: var(--sub); background: #F1EEF8; border-radius: 7px; padding: 1px 7px; }
  .trow p { font-size: 14.5px; line-height: 1.72; }
  .tmp { font-size: 10.5px; color: var(--cb); font-family: var(--pixel); margin-right: 4px; }
  .gtitle { font-family: var(--pixel); font-size: 14px; color: var(--ca); margin: 14px 20px 0; }
  .gsub { font-size: 12.5px; color: var(--sub); margin: 3px 20px 0; }

  /* ── 그래프 아래 패널. 기본은 팀 전체, 쌍을 누르면 그 둘의 이야기 ── */
  .panel { margin: 12px 18px 18px; border: 3px solid var(--ca-pale); border-radius: 16px; padding: 15px 17px 6px; }
  .panel .head { display: flex; justify-content: space-between; align-items: center; }
  .panel .x { font-family: var(--pixel); font-size: 11px; color: var(--sub); background: none; border: none; padding: 4px; }
  .panel .x:hover { color: var(--ink); }
  .panel h2 { font-family: var(--pixel); font-size: 14px; color: var(--ca); margin-bottom: 3px; }
  .panel .hint { font-size: 12.5px; color: var(--sub); margin-bottom: 10px; }
  .rule { padding: 11px 2px 12px; border-top: 2px dashed var(--edge); }
  .rule .sit { font-family: var(--pixel); font-size: 12px; color: var(--g-edge); margin-bottom: 5px; display: flex; gap: 8px; align-items: center; }
  .rule .sit i { font-style: normal; font-size: 11px; color: #fff; background: var(--g-light); border-radius: 7px; padding: 1px 6px; }
  .rule .sit i.same { background: var(--cb); }
  .rule p { font-size: 14.5px; line-height: 1.72; }

  /* ── 아래: 참가자 요약 ───────────────────── */
  .crew { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 12px; padding: 0 18px 20px; }
  .mate { border: 3px solid var(--edge); border-radius: 16px; padding: 13px 14px; }
  .mate .top { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .mate .top b { font-family: var(--pixel); font-size: 12px; }
  .mate .top small { display: block; color: var(--sub); font-size: 11.5px; margin-top: 2px; }
  .mate ul { list-style: none; }
  .mate li { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--sub); padding: 3px 0; }
  .mate li b { font-weight: 700; color: var(--ink); }
  .mate.empty { border-style: dashed; display: grid; place-items: center; color: var(--sub);
    font-family: var(--pixel); font-size: 12px; text-align: center; line-height: 2; min-height: 150px; }
</style>

<p class="note">[시안] 그래프가 문입니다. 기본은 팀 전체 이야기, 길을 누르면 아래가 그 두 사람 이야기로 바뀝니다. 축 1만 확정 톤이고 <b>[임시]</b>는 자리만 잡은 문구입니다.</p>

<div class="gwin">
  <div class="gbar">
    <span class="gt">떡볶이 원정대</span>
    <span class="gq">3명 참여 중 · 한 자리 남음</span>
  </div>

  <div class="graph" id="graph"><canvas id="trail"></canvas></div>
  <p class="gsub">길을 누르면 아래 내용이 그 두 사람의 이야기로 바뀝니다.</p>

  <div class="one">
    <i>우리 팀은</i>
    <p><span class="tmp">[임시]</span>결과물이 빨리 나가는 팀입니다. 마지막 검토를 자기 일로 아는 사람이 없어서, 밖으로 나가는 것만 하루 묵히는 규칙 하나가 필요합니다.</p>
  </div>

  <div class="panel" id="panel"></div>

  <div class="crew" id="crew"></div>

  <div class="acts">
    <button class="gbtn blue">팀 링크 공유하기</button>
    <button class="gbtn pink">나도 참여하기</button>
  </div>
</div>

    { 22: '둘 다 결과부터 봅니다. 용건만 오가도 서로 편하고 속도가 납니다. 대신 둘 다 분위기를 안 살피는 편이라, 팀에 다른 사람이 있으면 그쪽이 지치는 것을 늦게 알아차립니다.',
      21: '일을 먼저 보는 쪽의 담담한 말투를 중간쪽이 무리 없이 받아서 마찰이 적습니다. 급한 시기에는 사람 챙기는 일이 중간쪽에 몰리기 쉬우니, 그 몫도 일로 세어 주세요.',

      11: '상황에 따라 둘 다 움직여서 무난합니다. 규칙이 따로 필요하지 않고, 지금 무엇이 급한지만 서로 알려 주면 됩니다.',

      '00': '둘 다 사람을 먼저 봅니다. 분위기는 좋은데 문제 제기가 늦습니다. 감정 상할 일이 아니라고 미리 합의한 안건 목록을 두면 말을 꺼내기 쉬워집니다.' },
    { 22: '둘 다 끝까지 다듬습니다. 품질은 걱정이 없는데 마감이 밀립니다. 어디까지 다듬을지 범위를 시작할 때 정하면 둘의 기준이 같은 곳을 봅니다.',

      grid: ['...KK...', '..KYYK..', '.KYYYYK.', '.KYOOYK.', 'KYOOOOYK', 'KYOOOOYK', 'KYYOOYYK', '.KYYYYK.', 'KSSSSSSK', 'KWSSSSDK', '.KKBBKK.', '..KBDK..', '..KBDK..', '..KBDK..', '..KKKK..'] },
    bow: { pal: { B: '#A9743C', G: '#7C4F22', K: '#2E3A5C', W: '#EDEDF4' },
      grid: ['..........WKK.', '.........WKBKK', '........WKBBBK', '.......WKKBBKK', '......W.KBBBK.', '.....W.KKBBKK.', '....W.KKGBBK..', '...W.KKGGGKK..', '..WKKKGGGKK...', '.WKKBBBGKK....', 'WKBBBBBKK.....', 'KBBBBKKK......', 'KKBKKK........', '.KKK..........'] }
  };
  function sprite(art, scale) {
    const w = art.grid[0].length, h = art.grid.length;
    const cv = document.createElement('canvas');
    cv.width = w * scale; cv.height = h * scale;
    const g = cv.getContext('2d');
    art.grid.forEach((row, y) => [...row].forEach((c, x) => {
      if (art.pal[c]) { g.fillStyle = art.pal[c]; g.fillRect(x * scale, y * scale, scale, scale); }
    }));
    return cv;
  }

  /* 시안용 팀. bands 만 진짜 규칙대로 쓰인다. */
  const M = [
    { name: '제나', img: 'sprites/cat.png', item: 'note', tname: '신중한 탐색가', bands: [0, 1, 0, 1, 2], x: 50, y: 25 },
    { name: '밤이', img: 'sprites/dog.png', item: 'torch', tname: '거침없는 실행가', bands: [2, 1, 0, 1, 1], x: 20, y: 75 },
    { name: '도토리', img: 'sprites/hamster.png', item: 'bow', tname: '냉철한 해결사', bands: [1, 2, 1, 1, 1], x: 80, y: 75 }
  ];
  const PAIRS = [[0, 1], [0, 2], [1, 2]];
  const sameCount = (a, b) => a.bands.reduce((n, v, i) => n + (v === b.bands[i] ? 1 : 0), 0);
  const oppCount = (a, b) => a.bands.reduce((n, v, i) => n + (Math.abs(v - b.bands[i]) === 2 ? 1 : 0), 0);

  /* 강조하는 두 쌍: 구간 같은 축이 가장 많고 정반대가 없는 쌍 /
     정반대(높낮) 축이 가장 많은 쌍 */
  const stat = PAIRS.map(([a, b]) => ({ same: sameCount(M[a], M[b]), opp: oppCount(M[a], M[b]) }));
  const GOOD = stat.reduce((g, s, k) => (s.opp === 0 && (g < 0 || s.same > stat[g].same) ? k : g), -1);
  const WARN = stat.reduce((w, s, k) => (s.opp > 0 && (w < 0 || s.opp > stat[w].opp) ? k : w), -1);

  /* 팀 축 규칙. 분포는 시안 팀 기준으로 손으로 판정했고,
     축 1(의견이 갈릴 때)만 확정 톤, 나머지는 자리 잡기용 임시 문구다. */
  const TEAM_ROWS = [
    { ax: 0, dist: '먼저 말함 1 · 중간 1 · 먼저 들음 1', tmp: false,
      text: '먼저 말하는 쪽과 듣고 정리하는 쪽이 다 있는 팀입니다. 회의 자리에서는 말하는 쪽 의견이, 하루 지나면 듣는 쪽 의견이 나옵니다. 그날 결정할 것과 하루 묵힐 것을 나누기만 하면 양쪽 의견이 다 들어옵니다.' },
    { ax: 1, dist: '일 우선 1 · 중간 2', tmp: true,
      text: '급한 시기에 분위기를 살피는 일이 중간쪽 둘에게 몰립니다. 그 몫도 일로 세어 주면 됩니다.' },
    { ax: 2, dist: '빠르게 2 · 중간 1', tmp: true,
      text: '초안은 빨리 나오는데 마지막 검토가 아무의 일도 아닙니다. 밖으로 나가는 것만 하루 묵히는 규칙 하나면 됩니다.' },
    { ax: 3, dist: '전원 중간', tmp: true,
      text: '맡기고 확인하는 리듬이 비슷해서 걸릴 게 거의 없는 축입니다. 어디부터 크게 틀어진 것으로 볼지 기준만 한 번 맞춰 두세요.' },
    { ax: 4, dist: '준비형 1 · 중간 2', tmp: true,
      text: '준비는 제나 님이 먼저 시작합니다. 일정이 바뀌면 제나 님에게 먼저 알려야 다시 정리할 시간이 생깁니다.' }
  ];
  function renderTeam() {
    let html = '<h2>다섯 상황에서 우리 팀</h2>\n<p class="hint">쌍을 고르지 않았을 때는 팀 전체 이야기가 나옵니다.</p>';
    TEAM_ROWS.forEach((r) => {
      html += `<div class="trow"><div class="sit">▶ ${AXES[r.ax]} <i>${r.dist}</i></div>
        <p>${r.tmp ? '<span class="tmp">[임시]</span>' : ''}${r.text}</p></div>`;
    });
    $('panel').innerHTML = html;
  }

  /* 두 사람 사이를 게임 맵의 발판처럼 픽셀 사각형으로 잇는다.
     고른 쌍의 길은 파란 발판, 마우스를 올린 길은 미리 밝아진다.
     클릭 판정은 svg 대신 그래프에서 가장 가까운 길을 계산한다 —
     라벨만 눌리는 것처럼 보인다는 피드백이 있었다. */
  const graph = $('graph'), trail = $('trail');
  let picked = -1, hovered = -1;
  const seg = ([a, b]) => {
    const W = graph.clientWidth, H = graph.clientHeight;
    return [M[a].x / 100 * W, M[a].y / 100 * H, M[b].x / 100 * W, M[b].y / 100 * H];
  };
  function drawTrails() {
    const dpr = devicePixelRatio || 1;
    const W = graph.clientWidth, H = graph.clientHeight;
    trail.width = W * dpr; trail.height = H * dpr;
    const g = trail.getContext('2d');
    g.scale(dpr, dpr);
    PAIRS.forEach((pr, k) => {
      const on = k === picked, hov = k === hovered && !on;
      const [x1, y1, x2, y2] = seg(pr);
      const len = Math.hypot(x2 - x1, y2 - y1);
      const pad = 58, step = 13, size = on ? 8 : 6;
      g.fillStyle = on ? '#2B5BFF' : hov ? '#A9BEFF' : '#CBC5DC';
      for (let d = pad; d <= len - pad; d += step) {
        const t = d / len;
        const x = Math.round(x1 + (x2 - x1) * t - size / 2);
        const y = Math.round(y1 + (y2 - y1) * t - size / 2);
        g.fillRect(x, y, size, size);
      }
    });
  }
  addEventListener('resize', drawTrails);

  /* 점에서 선분까지의 거리. 14px 안이면 그 길 위에 있는 것으로 본다. */
  function nearLine(mx, my) {
    let best = -1, bd = 14;
    PAIRS.forEach((pr, k) => {
      const [x1, y1, x2, y2] = seg(pr);
      const dx = x2 - x1, dy = y2 - y1;
      const t = Math.max(0.12, Math.min(0.88, ((mx - x1) * dx + (my - y1) * dy) / (dx * dx + dy * dy)));
      const d = Math.hypot(mx - (x1 + dx * t), my - (y1 + dy * t));
      if (d < bd) { bd = d; best = k; }
    });
    return best;
  }
  const overPiece = (e) => e.target.closest('.who, .lbl');
  graph.addEventListener('mousemove', (e) => {
    const r = graph.getBoundingClientRect();
    const k = overPiece(e) ? -1 : nearLine(e.clientX - r.left, e.clientY - r.top);
    graph.style.cursor = k >= 0 ? 'pointer' : '';
    if (k !== hovered) { hovered = k; drawTrails(); }
  });
  graph.addEventListener('mouseleave', () => { hovered = -1; drawTrails(); });
  graph.addEventListener('click', (e) => {
    if (overPiece(e)) return;
    const r = graph.getBoundingClientRect();
    const k = nearLine(e.clientX - r.left, e.clientY - r.top);
    if (k >= 0) pick(k);
  });
  M.forEach((m) => {
    const d = document.createElement('div');
    d.className = 'who';
    d.style.left = m.x + '%'; d.style.top = m.y + '%';
    const pic = document.createElement('span'); pic.className = 'pic';
    const img = new Image(); img.src = m.img; img.width = 66; img.height = 66; img.className = 'chr';
    pic.append(img, sprite(ITEMS[m.item], 2));
    const b = document.createElement('b'); b.textContent = m.name;
    const s = document.createElement('span'); s.textContent = m.tname;
    d.append(pic, b, s);
    graph.appendChild(d);
  });
  const mark = (k) => (k === GOOD ? ' good' : k === WARN ? ' warn' : '');
  const badge = (k) => (k === GOOD ? '<em>합이 잘 맞아요</em>' : k === WARN ? '<em>규칙을 먼저 정하면 좋아요</em>' : '');
  const lbls = PAIRS.map(([a, b], k) => {
    const d = document.createElement('div');
    d.className = 'lbl' + mark(k);
    d.style.left = (M[a].x + M[b].x) / 2 + '%';
    d.style.top = (M[a].y + M[b].y) / 2 + '%';
    d.innerHTML = badge(k) + '결이 같은 축 ' + sameCount(M[a], M[b]) + ' / 5';
    d.addEventListener('click', () => pick(k));
    graph.appendChild(d);
    return d;
  });

  function closePair() {
    picked = -1;
    drawTrails();
    lbls.forEach((d, k) => d.className = 'lbl' + mark(k));
    renderTeam();
  }
  function pick(k) {
    picked = k;
    drawTrails();
    lbls.forEach((d, i) => d.className = 'lbl' + mark(i) + (i === k ? ' on' : ''));
    const [a, b] = PAIRS[k], A = M[a], B = M[b];
    let html = `<div class="head"><h2>${A.name} × ${B.name}</h2><button class="x" onclick="closePair()">← 팀 전체로</button></div>
      <p class="hint">다섯 상황에서 두 사람이 어떻게 맞물리는지입니다. 점수도 등급도 아닙니다.</p>`;
    AXES.forEach((ax, i) => {
      const key = [A.bands[i], B.bands[i]].sort((p, q) => q - p).join('');
      const same = A.bands[i] === B.bands[i];
      html += `<div class="rule">
        <div class="sit">▶ ${ax} <i class="${same ? 'same' : ''}">${same ? '결이 같음' : BAND[A.bands[i]] + ' · ' + BAND[B.bands[i]]}</i></div>
        <p>${RULES[i][key]}</p></div>`;
    });
    $('panel').innerHTML = html;
  }
  drawTrails();
  renderTeam();

  /* 아래: 참가자 요약 카드 + 빈 자리 */
  M.forEach((m) => {
    const d = document.createElement('div');
    d.className = 'mate';
    const top = document.createElement('div'); top.className = 'top';
    const img = new Image(); img.src = m.img; img.width = 40; img.height = 40; img.className = 'chr';
    const tx = document.createElement('div');
    tx.innerHTML = `<b>${m.name}</b><small>${m.tname}</small>`;
    top.append(img, tx);
    const ul = document.createElement('ul');
    AXES.forEach((ax, i) => {
      const li = document.createElement('li');
      li.innerHTML = `<span>${ax}</span><b>${BAND[m.bands[i]]}</b>`;
      ul.appendChild(li);
    });
    d.append(top, ul);
    $('crew').appendChild(d);
  });
  const empty = document.createElement('div');
  empty.className = 'mate empty';
  empty.textContent = '한 자리 남았어요';
  $('crew').appendChild(empty);
</script>
</html>
